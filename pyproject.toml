[project]
name = "phalo"
version = "0.1.0"
description = "YIIVA's smart engine — analytics, rankings, and search intelligence. Batch jobs over the shared Postgres; nuwa serves everything user-facing."
readme = "README.md"
authors = [
    { name = "khanyi", email = "khanyi.km3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.6",
    # Alembic runs migrations synchronously — psycopg drives that path while
    # asyncpg drives the runtime engine.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"
